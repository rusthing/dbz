[package]
name = "dbz-api-client"
version = "1.0.0"
edition = "2024"
authors = ["zbz"]
license = "MIT"
keywords = ["debezium", "api-client", "client"]
description = "API client for Debezium task management system"
categories = ["web-programming::http-server"]
homepage = "https://github.com/rusthing/dbz"
repository = "https://github.com/rusthing/dbz"
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
arc-swap = { workspace = true }
config = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_with = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }

wheel-rs = { workspace = true }
robotech = { workspace = true, features = ["feign", "macros", "registry-center"] }
dbz-api = { workspace = true }