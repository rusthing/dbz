# dbz-svr 配置文件
profile = "dev"

[db]
url = "postgresql://dbz:dbz@localhost:5432/dbz"

[redis]
url = "redis://:xxxxxxxx@redis:6379"

# API 客户端配置（对应 AppConfig::api），键名即客户端编码
[api.jobx]
type = "MicroSvc"
svc-name = "jobx-svr"

# 认证中心：删除画布节点前校验当前登录用户的审核口令
#
# svc-name 必须是 Consul 里的**注册服务名** `adm-rs-svr`（3 个 passing 实例）。
# 不要写成网关前缀 `/admrs-svr`（Consul 里没有这个服务，发现恒为 0 实例），
# 也不要写成 `adm-svr`（那是另一套老服务）。
# 生产以配置中心 KV `dbz-svr.toml` 为准，本文件会被它覆盖，两处要保持一致。
[api.adm]
type = "MicroSvc"
svc-name = "adm-rs-svr"
timeout = "5s"

# 报警中心：连接器异常告警的接收方，报警中心再转给消息中心投递
#
# 事件来源、报警级别、事件策略不需要在这里写：首次启动时由 dbz 自己按
# `[alarm]` 段的默认值（见 `config/alarm_config.rs`）登记到报警中心，之后
# 只补不改。要换级别/窗口/文案，就在下面三小段里覆盖对应字段。
#
# `timeout` 必须配：不配就是「永不超时」。巡检是串行的，报警中心卡住（慢查询、
# 锁等待、网络半开）会一直等下去，整轮检查停摆。800ms 对一次
# `alarm/alert/trigger` 足够宽裕（正常 2~20ms）。
[api.alarm]
type = "MicroSvc"
svc-name = "alarm-svr"
timeout = "800ms"

# 告警配置（对应 AppConfig::alarm），三段都有默认值，按需覆盖：
#
#   [alarm.event-source]  事件来源 code / name / remark
#   [alarm.alert-level]   级别分组 + 级别（默认复用报警中心的
#                         industrial_control 组、2 级「严重」）
#   [alarm.policy]        事件编码、标题/内容模板、合并窗口、重复提醒间隔
#
# 消息队列不配：按级别值拼 `msg.publish.alarm.{value}` 去报警中心查。
#[alarm]

# dbz 自身配置（对应 AppConfig::dbz）。jobx 计划分组名；不写或留空时使用默认值「Debezium」
#[dbz]
#group-name = "Debezium"

# Kafka Connect 原生死信队列（对应 `[dbz.dead-letter]`）。下面写的是默认值，按需覆盖：
#
#   坏记录由 Kafka Connect 写进 DLQ topic，重试也由 Connect 负责；dbz 只在部署下游
#   连接器时把这些 key 注入 connector_config，并从 DLQ topic 同步记录供页面查询。
#   dbz 侧没有重试队列、退避 worker，也不再要求业务脚本显式上报失败。
#
#   前提：下游接口必须把业务失败表达成非 2xx（不能再用 HTTP 200 + {"result":-2}），
#   否则 Connect 认为投递成功，任何 DLQ 都接不住。DLQ topic 不能被连接器的
#   topics / topics.regex 覆盖，否则 Connect 会在下发配置时拒掉。
#[dbz.dead-letter]
#enabled = true
#topic = "dbz-connect-dlq"         # 所有下游连接器共用的 DLQ topic
#replication-factor = 3
#retry-timeout-ms = 300000         # errors.retry.timeout
#retry-delay-max-ms = 30000        # errors.retry.delay.max.ms
#http-max-retries = 10             # HTTP Sink 的 max.retries
#http-retry-backoff-ms = 3000      # HTTP Sink 的 retry.backoff.ms
#log-enable = true
#log-include-messages = false
#sync-batch-size = 200             # 每轮每分区最多同步多少条
#retention-days = 30               # 页面索引保留天数
#max-per-connector = 50000

# DLQ 增量同步计划（对应 `[dbz.dead-letter.sync-job]`）：独立 jobx 计划，与健康检查
# 解耦，可单独调频率与执行器。默认值：计划名「Debezium死信同步」、每 60s 一次、
# 只处理最新消息、历史保留 7 天。要改频率，在此段覆盖对应字段即可。
#[dbz.dead-letter.sync-job]
#executor-code = "dbz.dead-letter-sync"
#interval = "60s"                  # 健康检查同频；要更慢只改这一处
#stream-max-len = 100
#task-expire = "168h"              # 同步历史保留 7 天

[micro-svc.consul]
base-url = "http://consul:8500"
[micro-svc.consul.registry]

[web]
port = 9006
