# dbz-svr 配置文件
profile = "dev"

[db]
url = "postgresql://dbz:dbz@localhost:5432/dbz"

[redis]
url = "redis://:xxxxxxxx@redis:6379"

# API 客户端配置（对应 AppConfig::api），键名即客户端编码
[api.jobx]
type = "MicroSvc"
svc-name = "jobx-svr"

# 报警中心：连接器异常告警的接收方，报警中心再转给消息中心投递
#
# 事件来源、报警级别、事件策略不需要在这里写：首次启动时由 dbz 自己按
# `[alarm]` 段的默认值（见 `config/alarm_config.rs`）登记到报警中心，之后
# 只补不改。要换级别/窗口/文案，就在下面三小段里覆盖对应字段。
#
# `timeout` 必须配：不配就是「永不超时」。巡检是串行的，报警中心卡住（慢查询、
# 锁等待、网络半开）会一直等下去，整轮检查停摆。800ms 对一次
# `alarm/alert/trigger` 足够宽裕（正常 2~20ms）。
[api.alarm]
type = "MicroSvc"
svc-name = "alarm-svr"
timeout = "800ms"

# 告警配置（对应 AppConfig::alarm），三段都有默认值，按需覆盖：
#
#   [alarm.event-source]  事件来源 code / name / remark
#   [alarm.alert-level]   级别分组 + 级别（默认复用报警中心的
#                         industrial_control 组、2 级「严重」）
#   [alarm.policy]        事件编码、标题/内容模板、合并窗口、重复提醒间隔
#
# 消息队列不配：按级别值拼 `msg.publish.alarm.{value}` 去报警中心查。
#[alarm]

# dbz 自身配置（对应 AppConfig::dbz）。jobx 计划分组名；不写或留空时使用默认值「Debezium」
#[dbz]
#group-name = "Debezium"

[micro-svc.consul]
base-url = "http://consul:8500"
[micro-svc.consul.registry]

[web]
port = 9006
