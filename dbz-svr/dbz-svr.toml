# dbz-svr 配置文件
profile = "dev"

[db]
url = "postgresql://dbz:dbz@localhost:5432/dbz"

[redis]
url = "redis://:xxxxxxxx@redis:6379"

# API 客户端配置（对应 AppConfig::api），键名即客户端编码
[api.jobx]
type = "MicroSvc"
svc-name = "jobx-svr"

# 告警配置（对应 AppConfig::alarm）
[alarm]
base-url = "http://localhost:8083/api"
# 告警事件编码（需在 alarm-svr 中预先配置对应的事件来源与策略）
event-code = "dbz-connector-status"
# 告警ID（对应 alarm-svr 中的 alarm_alert.id，取消注释并填写后才会真正上报告警）
# alert-id = 1

[micro-svc.consul]
base-url = "http://consul:8500"
[micro-svc.consul.registry]

[web]
port = 9006

[id-worker]
epoch = 1758108749211
# 0 = 自动从注册中心分配（同一服务的副本自动错开），>0 = 显式指定
node = 0