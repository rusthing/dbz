[workspace]
members = ["dbz-api", "dbz-api-client", "dbz-svr"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
log = "0.4.34"
tracing = "0.1.44"
clap = "4.6.7"
chrono = "0.4.45"
config = "0.15.27"
derive_setters = "0.1.9"
typed-builder = "0.23.2"
arc-swap = "1.9.3"
async-trait = "0.1.92"
serde = "1.0.229"
serde_with = "3.24.0"
serde_json = "1.0.154"
reqwest = "0.13.5"
tokio = "=1.53.3"
tokio-util = "0.7.19"
axum = "0.8.9"
sqlx = "0.9.0"
sea-orm = "2.0.4"
linkme = "0.3.37"
regex = "1.13.1"
o2o = "0.5.5"
validator = "0.21.0"
strum = "0.28.0"
utoipa = "6.0.0"
utoipa-swagger-ui = "10.0.2"
humantime = "2.4.0"
redis = "1.7.1"
# Kafka 协议客户端：只用来探 broker 与投递信号，纯 Rust，默认特性会带 lz4/zstd 的 C 依赖
rskafka = { version = "0.6.0", default-features = false, features = ["compression-gzip"] }

dbz-api = { version = "1.0.0", path = "./dbz-api" }
dbz-api-client = { version = "1.0.0", path = "./dbz-api-client" }
idworker = "1.4.0"
wheel-rs = "1.14.0"
robotech = "1.17.0"
robotech-macros = "1.17.0"
jobx-api = "1.0.0"
jobx-api-client = "1.0.0"
jobx-wkr = "1.0.0"
alarm-api = "1.0.0"
alarm-api-client = "1.0.0"

[patch.crates-io]
wheel-rs = { path = "../wheel-rs" }
robotech = { path = "../robotech-rs/robotech" }
robotech-macros = { path = "../robotech-rs/robotech-macros" }
dbz-api = { path = "./dbz-api" }
dbz-api-client = { path = "./dbz-api-client" }
jobx-api = { path = "../jobx/jobx-api" }
jobx-api-client = { path = "../jobx/jobx-api-client" }
jobx-wkr = { path = "../jobx/jobx-wkr" }
alarm-api = { path = "../alarm/alarm-api" }
alarm-api-client = { path = "../alarm/alarm-api-client" }